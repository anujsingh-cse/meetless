<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Meetless logo">
  <defs>
    <!-- agent nodes: indigo to violet -->
    <linearGradient id="ml-node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- shared workspace: violet to magenta -->
    <linearGradient id="ml-hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <!-- coordinated output: warm gold accent -->
    <linearGradient id="ml-flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <!-- soft depth -->
    <filter id="ml-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E1B4B" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- paths from each node to the shared center -->
    <g fill="none" stroke="url(#ml-node)" stroke-width="6" opacity="0.9">
      <path d="M32 34 L58 58"/>
      <path d="M96 34 L70 58"/>
      <path d="M64 29 L64 58"/>
    </g>
    <!-- three agent nodes converging on a central meeting point -->
    <g fill="url(#ml-node)" filter="url(#ml-shadow)">
      <circle cx="26" cy="28" r="9"/>
      <circle cx="102" cy="28" r="9"/>
      <circle cx="64" cy="18" r="10"/>
    </g>
    <!-- central meeting point: a rounded square (the shared workspace) -->
    <rect x="48" y="58" width="32" height="32" rx="8" fill="none" stroke="url(#ml-hub)" stroke-width="7" filter="url(#ml-shadow)"/>
    <!-- a single coordinated path leaving the workspace: the letter M -->
    <path d="M56 90 L56 104 L64 94 L72 104 L72 90" fill="none" stroke="url(#ml-flow)" stroke-width="7" filter="url(#ml-shadow)"/>
  </g>
</svg>
